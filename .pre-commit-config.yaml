repos:
  # The repository is public (otherwise the server cannot see the status check
  # through the anonymous GitHub API), so a leaked secret has to be revoked
  # rather than hidden. detect-private-key only covers PEM/SSH blocks; tokens
  # and cookies are gitleaks' job.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2  # keep in step with uv.lock: diverging versions format differently
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        # Runs inside the project's own uv-managed venv (not pre-commit's
        # isolated hook env), since the pydantic mypy plugin needs the real
        # installed packages to resolve.
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        args: [src, tests]
