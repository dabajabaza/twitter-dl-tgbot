# Extends gitleaks' default rule set rather than replacing it.
[extend]
useDefault = true

# Why this rule exists.
# The stock telegram-bot-api-token rule is gated on the word "telegram" sitting
# next to the secret. The token lives in TELEGRAM_BOT_TOKEN precisely so that
# rule catches it — but the bot's environment is not defined by this repository
# alone (an env file on the server, notes in the README), and renaming the
# variable later must not quietly open a hole. So the token is also caught by
# its shape: 8-10 digits, a colon, 35 base64url characters.
[[rules]]
id = "telegram-bot-token-anywhere"
description = "Telegram bot token (not gated on a keyword)"
regex = '''\b[0-9]{8,10}:[A-Za-z0-9_-]{35}\b'''
tags = ["telegram", "token"]

  # The array form [[rules.allowlists]], not the deprecated singular
  # [rules.allowlist]: v8 ignores the latter silently.
  #
  # Criteria inside ONE block are ANDed, which is why the path and the regex
  # live in separate blocks — together they would only exempt a file matching
  # both conditions at once.
  [[rules.allowlists]]
  description = "This config itself, so the rule does not flag its own examples"
  paths = ['''\.gitleaks\.toml$''']

  [[rules.allowlists]]
  description = "The obviously fake token used by the test harness"
  regexes = ['''123456:A{35}''']

# X cookies are the project's other secret, and they must never reach the
# repository at all. Caught by the characteristic pair of cookie names from a
# cookies.txt export.
[[rules]]
id = "x-cookie-session"
description = "X cookie session (auth_token / ct0) from cookies.txt"
regex = '''(?i)\b(auth_token|ct0)\b\s+[0-9a-f]{32,}'''
tags = ["x", "twitter", "cookie"]
