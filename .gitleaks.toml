# Расширяем дефолтный набор gitleaks, а не подменяем его.
[extend]
useDefault = true

# Зачем это правило.
# Штатное telegram-bot-api-token завязано на ключевое слово "telegram" рядом с
# секретом. Здесь токен лежит в TELEGRAM_BOT_TOKEN именно поэтому — стоковое
# правило его поймает. Но окружение бота задаётся не только этим репозиторием
# (env-файл на сервере, шпаргалки в README), а переименование переменной в
# будущем не должно тихо открывать дыру: ловим ещё и по самому виду токена —
# 8-10 цифр, двоеточие, 35 символов base64url.
[[rules]]
id = "telegram-bot-token-anywhere"
description = "Telegram bot token (без привязки к ключевому слову)"
regex = '''\b[0-9]{8,10}:[A-Za-z0-9_-]{35}\b'''
tags = ["telegram", "token"]

  # Форма именно [[rules.allowlists]] (массив), а не устаревшая [rules.allowlist]:
  # одиночная в v8 молча игнорируется.
  #
  # Критерии внутри ОДНОГО блока складываются через И, поэтому путь и regex
  # разнесены по разным блокам — иначе исключение срабатывало бы только для
  # файла, который подходит под оба условия сразу.
  [[rules.allowlists]]
  description = "Сам этот конфиг, чтобы правило не ругалось на свои же примеры"
  paths = ['''\.gitleaks\.toml$''']

  [[rules.allowlists]]
  description = "Заведомо фальшивый токен из тестовой обвязки"
  regexes = ['''123456:A{35}''']

# Куки X — второй секрет проекта, и он в репозиторий попасть не должен вообще.
# Ловим характерную пару cookie-имён из выгрузки cookies.txt.
[[rules]]
id = "x-cookie-session"
description = "Cookie-сессия X (auth_token / ct0) из cookies.txt"
regex = '''(?i)\b(auth_token|ct0)\b\s+[0-9a-f]{32,}'''
tags = ["x", "twitter", "cookie"]
