name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

# One active run per ref: a new push cancels the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  # The job's name IS the status check name that the main branch ruleset refers
  # to, and that the server looks for before deploying a tag (an anonymous call
  # to the check-runs API). It cannot be changed without updating the ruleset:
  # the protection would quietly stop requiring a green CI, and the deploy would
  # stop finding the check and never roll out another tag.
  ci:
    name: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks looks at the whole history, not just the last commit
          fetch-depth: 0

      - name: Scan for secrets
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" detect \
            --source . --log-opts=--all --no-banner --redact

      # An exact version rather than a major tag: setup-uv publishes moving tags
      # only up to v7, although its releases have reached 9.0.0. A @v9 reference
      # does not resolve, and the job fails during "Set up job" without reaching
      # a single step.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies strictly from the lock file
        run: uv sync --locked

      # The server has no uv: there, dependencies are installed with pip from
      # requirements.txt, which is generated from uv.lock. Forgetting to
      # regenerate it would have the deploy install something CI never checked,
      # and the two would diverge silently. Regenerate with the same command and
      # require no diff (the command is written into the file's header, so
      # exporting to a temporary path would produce a false mismatch).
      - name: requirements.txt still matches uv.lock
        run: |
          uv export --format requirements-txt --no-hashes --no-dev -o requirements.txt
          git diff --exit-code -- requirements.txt

      - name: Lint
        run: uv run ruff check .

      - name: Formatting
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy src tests

      - name: Tests
        run: uv run pytest -q
